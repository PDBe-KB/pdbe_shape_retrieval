[project]
name = "pdbe-shape-retrieval"
description = "This python package calculates surface shape descriptors for macromolecular assemblies and interfaces, and computes shape similarity scores."
authors = [
  {name = "Grisell Diaz Leines", email = "gdiazleines@ebi.ac.uk"},
]
keywords = ["interfaces", "structural biology", "shape descriptors", "macromolecular assemblies", "interfaces", "similarity scores"]
version = "2.0.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pyfmaps>=1.0.1",
    "pymeshfix>=0.18.1",
    "pymeshlab>=2025.7.post1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.12.0",
    "trimesh>=4.12.2",
]

[project.urls]
Repository = "https://github.com/PDBe-KB/pdbe_shape_retrieval.git"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shape_retrieval*"]

[project.scripts]
shape_retrieval = "shape_retrieval.cli:main"

[dependency-groups]
test = ["pytest", "coverage"]
